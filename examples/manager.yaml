manager:
  database_path: /var/lib/lammps-manager/state.sqlite3
storage:
  mode: shared
  work_root: /shared/lammps/jobs
job_defaults:
  mpi_ranks: 4
  omp_threads_per_rank: 1
  memory_gib: 8
  time_limit_seconds: 86400
  max_retries: 0
scheduler:
  default_priority: 0
  policy: fifo_least_loaded
  max_cpu_utilization_percent: 80
  min_slots: 0
  reserve_slots: 0
workers:
  - id: node-a
    cpu_slots: 24
    memory_budget_gib: 96
    max_concurrent_jobs: 4
    labels: [cpu]

# Snapshotted for future submissions; independent of application max_retries.
infrastructure_recovery:
  max_retries: 1
  delay_seconds: 30

# Operational alerts; does not alter submitted job specifications.
monitoring:
  transfer_stall_seconds: 300
  low_disk_gib: 5

# Frozen per explicit continuation run; scientific capability gates still apply.
segmentation:
  step_max: 100000
  environment_reset_seconds: 3600
